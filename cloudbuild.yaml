steps:
  # ---- Run backend tests ----
  - name: "python:3.11-slim"
    entrypoint: bash
    args:
      - "-c"
      - |
        cd backend
        pip install -r requirements.txt
        pip install pytest httpx
        python -m pytest tests/ -v || true

  # ---- Build & push backend image ----
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/wealth-platform/backend:${SHORT_SHA}",
        "./backend",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/wealth-platform/backend:${SHORT_SHA}",
      ]

  # ---- Build & push frontend image ----
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/wealth-platform/frontend:${SHORT_SHA}",
        "./frontend",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/wealth-platform/frontend:${SHORT_SHA}",
      ]

  # ---- Deploy backend to Cloud Run ----
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "wealth-backend"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/wealth-platform/backend:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--no-allow-unauthenticated"

  # ---- Deploy frontend to Cloud Run ----
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "wealth-frontend"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/wealth-platform/frontend:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

substitutions:
  _REGION: asia-south1

options:
  logging: CLOUD_LOGGING_ONLY
