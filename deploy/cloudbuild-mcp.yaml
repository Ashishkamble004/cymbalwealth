steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-mcp"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/nse-bse-mcp-server:${_TAG}",
        "./backend/mcp_server",
      ]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-mcp"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/nse-bse-mcp-server:${_TAG}",
      ]
    waitFor: ["build-mcp"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-mcp"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "nse-bse-mcp-server",
        "--image",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/nse-bse-mcp-server:${_TAG}",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--memory",
        "1Gi",
        "--cpu",
        "1",
        "--min-instances",
        "0",
        "--max-instances",
        "5",
        "--concurrency",
        "10",
        "--timeout",
        "60",
        "--set-env-vars",
        "PYTHONUNBUFFERED=1,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},MCP_SERVER_NAME=agentregistry-00000000-0000-0000-4b8f-8f1258474497,GOOGLE_GENAI_USE_VERTEXAI=True",
      ]
    waitFor: ["push-mcp"]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/nse-bse-mcp-server"

substitutions:
  _REGION: us-central1
  _REPO: cymbal-wealth
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
